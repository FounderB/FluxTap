name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Build
        run: go build -o fluxtap ./cmd/fluxtap
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Generate demo + parse smoke
        run: |
          ./fluxtap gen testdata/demo.pcap --count 80
          ./fluxtap parse testdata/demo.pcap -q
          ./fluxtap bench testdata/demo.pcap
